name: Publish Qodynex Business runtime

on:
  push:
    branches: [qodynex-business-runtime]
    paths: [.github/workflows/publish-qodynex-runtime.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: qodynex-business-runtime-v0.1.0
      ASSET: qodynex-server.zip
      EXPECTED_SHA256: 39eca6cfda3429846e6af6fdd5f72675c5e5432548559c5c48825f472ccfcb78
      RUNTIME_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-5bfc-81fa-89e4-8265a1f88e05/raw?se=2026-11-19T12%3A49%3A42Z&sp=r&sv=2026-06-06&sr=b&scid=9da5e434-b964-5836-bb4b-c7be503fb240&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-19T12%3A06%3A55Z&ske=2026-11-20T12%3A06%3A55Z&sks=b&skv=2026-06-06&sig=TsYms%2BB2LTqqNaKKBBq/Qb3Da2wVVMJc%2BsOjn17tLUQ%3D'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download verified compiled server artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$RUNTIME_URL" --output "$ASSET"
          echo "$EXPECTED_SHA256  $ASSET" | sha256sum -c -
      - name: Publish durable public runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes "Compiled ASP.NET Core runtime only. Source remains private. SHA-256: $EXPECTED_SHA256"
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "Qodynex Business server runtime 0.1.0" \
              --notes "Compiled ASP.NET Core runtime only. Source remains private. SHA-256: $EXPECTED_SHA256"
          fi
